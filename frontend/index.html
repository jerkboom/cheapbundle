<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BundleHub – Cheap Data Bundles in Ghana</title>
    <meta name="description" content="Get affordable and reliable data bundles in Ghana via BundleHub." />
    <meta property="og:title" content="BundleHub – Cheap Data Bundles in Ghana" />
    <style>
      /* Inline loading screen — renders before any JS loads */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F8FAFC;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        gap: 24px;
      }
      #app-loader .logo-mark {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #app-loader .logo-icon {
        width: 40px;
        height: 40px;
        background: rgba(37, 99, 235, 0.1);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(37, 99, 235, 0.2);
      }
      #app-loader .logo-icon svg {
        width: 22px;
        height: 22px;
        color: #2563EB;
      }
      #app-loader .logo-text {
        font-size: 26px;
        font-weight: 900;
        color: #0F172A;
        letter-spacing: -0.5px;
        line-height: 1;
      }
      #app-loader .logo-text span {
        color: #2563EB;
      }
      #app-loader .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #E2E8F0;
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: app-spin 0.7s linear infinite;
      }
      #app-loader .tagline {
        font-size: 13px;
        color: #94A3B8;
        font-weight: 500;
        letter-spacing: 0.5px;
        animation: app-pulse 2s ease-in-out infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant loading screen — replaced automatically when React mounts -->
      <div id="app-loader">
        <div class="logo-mark">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5Z" />
              <path d="M2 17l10 5 10-5" />
              <path d="M2 12l10 5 10-5" />
            </svg>
          </div>
          <div class="logo-text">BundleHub<span>.</span></div>
        </div>
        <div class="spinner"></div>
        <div class="tagline">Loading your bundles…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
